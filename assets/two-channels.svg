<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336" role="img" aria-labelledby="chTitle chDesc">
  <rect width="100%" height="100%" fill="#05070D"/>
<style>
  .dg-box{fill:#0d121a;stroke:#2A2F33}
  .dg-box-a{fill:#0f1726;stroke:#3A86FF;stroke-opacity:.35}
  .dg-t{fill:#F6F8FA;font-family:Poppins,system-ui,sans-serif;font-size:13px}
  .dg-s{fill:#9BA7B4;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em}
  .dg-l{fill:#3A86FF;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em}
  .dg-line{stroke:#2A2F33;stroke-width:1.2;fill:none}
  .dg-line-a{stroke:#3A86FF;stroke-width:1.4;fill:none;opacity:.85}
</style>

  <title id="chTitle">Two channels with opposite defaults</title>
  <desc id="chDesc">Work in a matter flows into two separate mechanisms. The Client Communication Protocol is automatic, batched into one blinded root per firm per period, on one shared network-wide contract, and what lands on chain is a root with no firm, no matter and no count. Document Record is opt-in per document by a lawyer, one commitment per document, on a per-matter contract, and what lands on chain is a commitment, a disposition and a timestamp.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect x="330" y="8" width="220" height="52" rx="10" class="dg-box"/>
  <text class="dg-t" x="440.0" y="31.0" text-anchor="middle">Work in the matter</text>
  <text class="dg-s" x="440.0" y="49.0" text-anchor="middle">DRAFTS, ADVICE, DOCUMENTS</text>

  <path class="dg-line" d="M400 60 V78 H225 V96" marker-end="url(#ah)" style="color:#2A2F33"/>

  <path class="dg-line" d="M480 60 V78 H655 V96" marker-end="url(#ah)" style="color:#2A2F33"/>

  <rect x="20" y="96" width="410" height="56" rx="10" class="dg-box-a"/>
  <text class="dg-t" x="225.0" y="121.0" text-anchor="middle">Client Communication Protocol</text>
  <text class="dg-s" x="225.0" y="139.0" text-anchor="middle">PRIVILEGED TRAFFIC — DEFAULT ON</text>

  <rect x="450" y="96" width="410" height="56" rx="10" class="dg-box-a"/>
  <text class="dg-t" x="655.0" y="121.0" text-anchor="middle">Document Record</text>
  <text class="dg-s" x="655.0" y="139.0" text-anchor="middle">WORK PRODUCT LEAVING THE PRIVILEGE</text>

  <rect x="38" y="178" width="7" height="7" rx="1.5" fill="#3A86FF"/>
  <text class="dg-t" x="54" y="186">Automatic. It sweeps everything.</text>

  <rect x="38" y="202" width="7" height="7" rx="1.5" fill="#3A86FF"/>
  <text class="dg-t" x="54" y="210">One blinded root per firm per period.</text>

  <rect x="38" y="226" width="7" height="7" rx="1.5" fill="#3A86FF"/>
  <text class="dg-t" x="54" y="234">One shared, network-wide contract.</text>

  <rect x="468" y="178" width="7" height="7" rx="1.5" fill="#3A86FF"/>
  <text class="dg-t" x="484" y="186">Opt-in, per document, by a lawyer.</text>

  <rect x="468" y="202" width="7" height="7" rx="1.5" fill="#3A86FF"/>
  <text class="dg-t" x="484" y="210">One commitment per document.</text>

  <rect x="468" y="226" width="7" height="7" rx="1.5" fill="#3A86FF"/>
  <text class="dg-t" x="484" y="234">One contract per matter.</text>

  <rect x="20" y="262" width="410" height="62" rx="10" class="dg-box"/>
  <text class="dg-t" x="225.0" y="290.0" text-anchor="middle">A root.</text>
  <text class="dg-s" x="225.0" y="308.0" text-anchor="middle">NO FIRM. NO MATTER. NO COUNT.</text>

  <rect x="450" y="262" width="410" height="62" rx="10" class="dg-box"/>
  <text class="dg-t" x="655.0" y="290.0" text-anchor="middle">Commitment, disposition, timestamp.</text>
  <text class="dg-s" x="655.0" y="308.0" text-anchor="middle">TO A NAMED THIRD PARTY, NOW.</text>

  <path class="dg-line" d="M225 244 V252" marker-end="url(#ah)" style="color:#2A2F33"/>

  <path class="dg-line" d="M655 244 V252" marker-end="url(#ah)" style="color:#2A2F33"/>

</svg>