<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" role="img" aria-labelledby="fvaT fvaD">
  <title id="fvaT">How redaction works: the template and the vault</title>
  <desc id="fvaD">An original document, "Jane Roe v. Acme Corp.", goes into the redactor on the firm's appliance. The redactor makes two things. The template replaces each name with a stable token, PARTY_1 v. ORG_1, and that is the only version the AI model, the search index or a hash ever sees. The vault is a small sealed map from each token back to the real name. It is locked with AES-GCM and never touches a model. Putting the names back is logged as a disclosure.</desc>
  <defs><marker id="m-va" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect x="10" y="70" width="210" height="110" rx="10" class="dg-box"/>
  <text class="dg-s" x="26" y="94">THE ORIGINAL</text>
  <text class="dg-t" x="26" y="120">Jane Roe v. Acme Corp.</text>
  <text class="dg-t" x="26" y="142">Ms. Roe worked for Acme</text>
  <text class="dg-t" x="26" y="164">from 2019 to 2024 …</text>
  <rect x="262" y="84" width="170" height="82" rx="10" class="dg-box-a"/>
  <text class="dg-s" x="347" y="108" text-anchor="middle">ON THE APPLIANCE</text>
  <text class="dg-t" x="347" y="132" text-anchor="middle">Redactor</text>
  <text class="dg-s" x="347" y="152" text-anchor="middle">SIGNED · VERSIONED</text>
  <rect x="478" y="20" width="392" height="110" rx="10" class="dg-box-a"/>
  <text class="dg-s" x="494" y="44">THE TEMPLATE · WHAT THE AI SEES</text>
  <text class="dg-t" x="494" y="70">[PARTY_1] v. [ORG_1]</text>
  <text class="dg-t" x="494" y="92">[PARTY_1] worked for [ORG_1] …</text>
  <text class="dg-s" x="494" y="116">GOES TO THE MODEL, THE INDEX, THE HASH</text>
  <rect x="478" y="150" width="392" height="110" rx="10" class="dg-box"/>
  <text class="dg-s" x="494" y="174">THE VAULT · SEALED</text>
  <text class="dg-t" x="494" y="200">PARTY_1 → Jane Roe</text>
  <text class="dg-t" x="494" y="222">ORG_1 → Acme Corp.</text>
  <text class="dg-s" x="494" y="246">LOCKED WITH AES-GCM · NEVER SEEN BY AI</text>
  <path class="dg-line-a" d="M220 125 H256" marker-end="url(#m-va)" style="color:#3A86FF"/>
  <path class="dg-line-a" d="M432 110 H452 V75 H472" marker-end="url(#m-va)" style="color:#3A86FF"/>
  <path class="dg-line" d="M432 140 H452 V205 H472" marker-end="url(#m-va)" style="color:#9BA7B4"/>
  <text class="dg-s" x="10" y="220">SAME PERSON, SAME TOKEN,</text>
  <text class="dg-s" x="10" y="236">ACROSS THE WHOLE MATTER</text>
  <text class="dg-l" x="10" y="282">TOKENS COME FROM AN HMAC KEYED TO ONE MATTER · PUTTING NAMES BACK IS LOGGED AS A DISCLOSURE</text>
</svg>
